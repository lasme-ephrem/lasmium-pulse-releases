name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run the app?
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Docker / home server
        - From the sources (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (if not the desktop app)
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console
      description: Logs never contain your Twitch tokens; still read them before pasting.
      render: text
